<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <nav class="box">
        <div class="img">
          <img
            src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQW7dCa7LxGYi_UDRx4mDpJnKAmAIAs3VaazpNx1N7GHw&s=10"
            alt=""
          />

        <div class="links">
          <p>highlights</p>
          <p>Design</p>
          <p>Performance</p>
          <p>Charging</p>
          <p>Configure</p>
        </div>

        <button>TEST DRIVE</button>

      <section class="box">
        <h1>TAYCAN</h1>
        <div class="car-div">
          <img width="1400" src="./assets/car.png" alt="" />
        </div>
      </section>

      <footer class="box">
        <div>
          <h2 id="porsche">PORSCHE</h2>
          <p id="dets"><span style="font-weight: 700">TAYCAN</span> Turbo S</p>
        </div>

        <div class="mid">
          <div>
            <p>WLTP</p>
            <h2>412km</h2>

          <div>
            <p>0-100KM/H</p>
            <h2>2.8s</h2>
          </div>

          <div>
            <p>HP</p>
            <h2>560</h2>
          </div>
        </div>

        <div class="imgDiv">
          <div class="imgBox">
            <img
              src="https://cimg3.ibsrv.net/ibimg/hgm/1920x1080-1/100/714/2020-porsche-taycan_100714595.jpg"

          </div>
          <div class="imgBox">
            <img
              src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTnsiWd1cmmMQkbAPgWoLkbGJBjJ_Hfliv8OU7khEXPuDX-i93W1oEoFyzK&s=10"
              alt=""
            />
          </div>
          <div class="imgBox">
            <img
              src="https://akm-img-a-in.tosshub.com/indiatoday/styles/medium_crop_simple/public/2022-11/0q2a0695_c.jpg?VersionId=qtxmkOn9n3VEq9bXGPkIoKt99ivzJ810&size=750:*"
              alt=""
            />
          </div>
        </div>
